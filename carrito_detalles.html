<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito de compras</title>

    <!-- Tipografía Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 y Bootstrap Icons (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilos propios del equipo (css/style.css) -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        /* Ajustes solo para esta página */
        body { background-color: #f8f9fa; }
        #resumen-compra { top: 1rem; }
        #total-compra { font-weight: 700; }
        #mensaje-vacio i { font-size: 3rem; }
    </style>
</head>

<body>

    <!-- ===== Barra de navegación (misma que index.html) ===== -->
    <nav id="barra-navegacion" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-cpu"></i> Tecnoteca</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
                aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu-principal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a id="enlace-productos" class="nav-link" href="index.html#productos">
                            <i class="bi bi-box-seam"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a id="enlace-contacto" class="nav-link" href="index.html#contacto">
                            <i class="bi bi-envelope"></i> Contacto
                        </a>
                    </li>
                    <li class="nav-item">
                        <a id="enlace-carrito" class="nav-link active" aria-current="page" href="carrito_detalles.html">
                            <i class="bi bi-cart3"></i> Carrito
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== Contenedor de alertas (lo llena mostrarAlerta en JS) ===== -->
    <div id="contenedor-alertas" class="position-fixed top-0 end-0 p-3" aria-live="polite"></div>

    <main class="container my-4">
        <h1 class="h3 mb-4"><i class="bi bi-cart3"></i> Tu carrito</h1>

        <div class="row g-4">

            <!-- ===== Columna de productos ===== -->
            <section class="col-lg-8" aria-label="Productos en el carrito">

                <!-- Aviso de carrito vacío (oculto; el JS lo muestra si no hay productos) -->
                <div id="mensaje-vacio" class="d-none text-center text-muted bg-white border rounded p-5">
                    <i class="bi bi-cart-x d-block mb-3"></i>
                    <p class="h5 mb-3">Tu carrito está vacío</p>
                    <a href="index.html#productos" class="btn btn-outline-primary">Ver productos</a>
                </div>

                <!-- Tarjetas de productos (las dibuja el JS) -->
                <div id="lista-carrito" class="row g-3"></div>
            </section>

            <!-- ===== Columna de resumen ===== -->
            <aside class="col-lg-4">
                <div id="resumen-compra" class="card shadow-sm position-sticky">
                    <div class="card-body">
                        <h2 class="h5 card-title mb-3">Resumen</h2>
                        <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-3">
                            <span class="fs-5">Total</span>
                            <span class="fs-4" aria-live="polite">$<span id="total-compra">0.00</span></span>
                        </div>
                        <button type="button" id="btn-finalizar" class="btn btn-success btn-lg w-100 btn-finalizar">
                            <i class="bi bi-bag-check"></i> Finalizar Compra
                        </button>
                        <button type="button" id="btn-exportar-txt" class="btn btn-outline-primary w-100 mt-2">
                            <i class="bi bi-download"></i> Descargar carrito.txt
                        </button>
                        <a href="index.html#productos" class="btn btn-link w-100 mt-2">Seguir comprando</a>
                    </div>
                </div>
            </aside>

        </div>
    </main>

    <!-- ===== Ventana de compra finalizada (la llena finalizarCompra en JS) ===== -->
    <div class="modal fade" id="modal-compra" tabindex="-1" aria-labelledby="titulo-modal-compra" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="titulo-modal-compra">
                        <i class="bi bi-bag-check"></i> ¡Compra realizada!
                    </h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>Estos son los productos que compraste:</p>
                    <ul id="lista-compra" class="list-group mb-3"></ul>
                    <p class="d-flex justify-content-between fs-5 fw-bold mb-0">
                        <span>Total</span>
                        <span>$<span id="total-compra-modal">0.00</span></span>
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts: primero Bootstrap, luego utilidades.js y al final script.js (en este orden) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
