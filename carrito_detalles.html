<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito de compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    /* Ajustes solo para esta página */
    body { background-color: #f8f9fa; }
    #resumen-compra { top: 1rem; }
    #total-compra { font-weight: 700; }
    #mensaje-vacio i { font-size: 3rem; }
  </style>
</head>
<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-shop"></i> Tienda en línea
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
              aria-expanded="false" aria-label="Mostrar menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html#productos">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#contacto">Contacto</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="carrito_detalles.html">
              <i class="bi bi-cart"></i> Carrito
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenedor de alertas -->
  <div id="contenedor-alertas"></div>

  <main class="container my-4">
    <h1 class="h3 mb-4"><i class="bi bi-cart3"></i> Tu carrito</h1>

    <div class="row g-4">

      <!-- Columna de productos -->
      <section class="col-lg-8" aria-label="Productos en el carrito">

        <!-- Aviso de carrito vacío -->
        <div id="mensaje-vacio" class="text-center text-muted bg-white border rounded p-5">
          <i class="bi bi-cart-x d-block mb-3"></i>
          <p class="h5 mb-3">Tu carrito está vacío</p>
          <a href="index.html#productos" class="btn btn-outline-primary">Ver productos</a>
        </div>

        <!-- Tarjetas de productos -->
        <div id="lista-carrito" class="row g-3"></div>
      </section>

      <!-- Columna de resumen -->
      <aside class="col-lg-4">
        <div id="resumen-compra" class="card shadow-sm position-sticky">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Resumen</h2>
            <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-3">
              <span class="fs-5">Total</span>
              <span class="fs-4" aria-live="polite">$<span id="total-compra">0.00</span></span>
            </div>
            <!-- Ajuste de id y clase del botón -->
            <button type="button" id="btn-finalizar-compra" class="btn btn-success btn-lg w-100 btn-finalizar">
              <i class="bi bi-bag-check"></i> Finalizar Compra
            </button>
            <a href="index.html#productos" class="btn btn-link w-100 mt-2">Seguir comprando</a>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
